<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIKL LINK</title>
<style>
  :root{
    --navy: #1a4066;
    --bg: #eef0f2;
    --card-bg: #f3f4f6;
    --white: #ffffff;
    --text-dark: #1c1c1c;
    --text-grey: #7a7a7a;
    --label-color: #2b5878;
    --accent-blue: #2f6fb0;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#d9dde1; font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; }
  .phone { max-width:430px; margin:0 auto; background:var(--bg); min-height:100vh; position:relative; }

  .app-header {
    background: var(--navy);
    color:#fff;
    display:flex; align-items:center; justify-content:center; position:relative;
    padding: 22px 20px 54px;
  }
  .app-header h1 { margin:0; font-size:26px; font-weight:700; }
  .header-icons { position:absolute; right:20px; top:22px; display:flex; gap:20px; }
  .header-icons button { background:none; border:none; color:#fff; cursor:pointer; padding:0; line-height:1; }

  .profile-wrap { padding:0 18px; margin-top:-38px; }
  .profile-card {
    background:var(--card-bg);
    border-radius:14px;
    padding:78px 22px 26px;
    text-align:center;
    position:relative;
  }
  .avatar-wrap { position:absolute; top:-56px; left:50%; transform:translateX(-50%); }
  .avatar {
    width:132px; height:132px; border-radius:50%;
    background:#dfe4e8; border:5px solid #fff;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .avatar svg { width:100%; height:100%; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .camera-btn {
    position:absolute; bottom:2px; right:2px; width:36px; height:36px;
    background:var(--accent-blue); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:3px solid #fff;
  }
  .profile-name { font-size:21px; font-weight:800; color:var(--text-dark); line-height:1.3; margin:2px 0 10px; }
  .profile-email, .profile-id { color:var(--text-grey); font-size:14.5px; margin:2px 0; }

  .menu-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:24px 18px 20px; }
  .menu-card {
    background:var(--white); border-radius:8px;
    padding:26px 6px 18px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    cursor:pointer;
  }
  .menu-card .icon { width:64px; height:64px; }
  .menu-card .label { font-size:15px; font-weight:700; color:var(--label-color); }

  .service-desk {
    position:sticky; bottom:70px;
    display:flex; justify-content:flex-end; align-items:center; gap:10px;
    padding:20px 18px 0;
  }
  .service-desk-label {
    background:#3d3d3d; color:#fff; padding:13px 18px; border-radius:8px;
    font-size:14.5px; font-weight:600;
  }
  .service-desk-avatar {
    width:56px; height:56px; border-radius:50%; background:#3d3d3d;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .service-desk-avatar svg { width:70%; height:70%; }

  .footer { text-align:center; color:var(--text-grey); font-size:13px; padding:30px 10px 30px; }
</style>
</head>
<body>
<div class="phone">

  <div class="app-header">
    <h1>Home</h1>
    <div class="header-icons">
      <button aria-label="Notifications">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2a6 6 0 0 0-6 6v3.5L4 15h16l-2-3.5V8a6 6 0 0 0-6-6Z" fill="#fff"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0Z" fill="#fff"/></svg>
      </button>
      <button aria-label="Log out">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="12" height="16" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M11 12h9M17 8l4 4-4 4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </div>
  </div>

  <div class="profile-wrap">
    <div class="profile-card">
      <div class="avatar-wrap">
        <div class="avatar">
          <img src="profile.jpg" alt="Profile photo">
        </div>
        <div class="camera-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l2-2h6l2 2h3v11H4Z" fill="#fff"/><circle cx="12" cy="13.5" r="3.4" fill="#2f6fb0"/></svg>
        </div>
      </div>
      <div class="profile-name">NOR FATIHAH ALEEYA BINTI MOHD SALEHHUDDIN</div>
      <div class="profile-email">fatihah.salehuddin@s.unikl.edu.my</div>
      <div class="profile-id">62212124514 &ndash; UniKL BiS</div>
    </div>
  </div>

  <div class="menu-grid">
    <div class="menu-card" onclick="location.hash='academic'">
      <svg class="icon" viewBox="0 0 64 64">
        <path d="M12 12h30a6 6 0 0 1 6 6v34H18a6 6 0 0 1-6-6Z" fill="#f4c9b8"/>
        <path d="M12 12h30a6 6 0 0 1 6 6v3H12Z" fill="#e2574c"/>
        <path d="M12 18a6 6 0 0 1 6-6h6v40h-6a6 6 0 0 1-6-6Z" fill="#d94f45"/>
        <rect x="22" y="10" width="6" height="16" fill="#f2b23c"/>
      </svg>
      <div class="label">Academic</div>
    </div>

    <div class="menu-card" onclick="location.hash='residential'">
      <svg class="icon" viewBox="0 0 64 64">
        <rect x="42" y="8" width="6" height="10" fill="#c76b4a"/>
        <path d="M6 30 32 10l26 20v3H6Z" fill="#e2574c"/>
        <path d="M12 33h40v22H12Z" fill="#f6c358"/>
        <rect x="22" y="40" width="9" height="15" fill="#8a5a3b"/>
        <rect x="35" y="41" width="12" height="9" fill="#5fa9d6"/>
        <line x1="41" y1="41" x2="41" y2="50" stroke="#3d7ea6" stroke-width="1.4"/>
        <line x1="35" y1="45.5" x2="47" y2="45.5" stroke="#3d7ea6" stroke-width="1.4"/>
      </svg>
      <div class="label">Residential</div>
    </div>

    <div class="menu-card" onclick="location.hash='financial'">
      <svg class="icon" viewBox="0 0 64 64">
        <ellipse cx="24" cy="46" rx="13" ry="5" fill="#c9932c"/>
        <rect x="11" y="38" width="26" height="8" fill="#f4c542"/>
        <ellipse cx="24" cy="38" rx="13" ry="5" fill="#ffe27a"/>
        <ellipse cx="40" cy="34" rx="14" ry="5.5" fill="#c9932c"/>
        <rect x="26" y="20" width="28" height="14" fill="#f4c542"/>
        <ellipse cx="40" cy="20" rx="14" ry="5.5" fill="#ffe27a"/>
      </svg>
      <div class="label">Financial</div>
    </div>

    <div class="menu-card" onclick="location.hash='attendance'">
      <svg class="icon" viewBox="0 0 64 64">
        <rect x="8" y="8" width="48" height="48" rx="3" fill="#fff" stroke="#183a5c" stroke-width="2"/>
        <rect x="12" y="12" width="10" height="10" fill="#183a5c"/>
        <rect x="15" y="15" width="4" height="4" fill="#fff"/>
        <rect x="42" y="12" width="10" height="10" fill="#183a5c"/>
        <rect x="45" y="15" width="4" height="4" fill="#fff"/>
        <rect x="12" y="42" width="10" height="10" fill="#183a5c"/>
        <rect x="15" y="45" width="4" height="4" fill="#fff"/>
        <rect x="27" y="12" width="4" height="4" fill="#183a5c"/>
        <rect x="35" y="16" width="4" height="4" fill="#183a5c"/>
        <rect x="27" y="20" width="4" height="8" fill="#183a5c"/>
        <rect x="36" y="24" width="8" height="4" fill="#183a5c"/>
        <rect x="12" y="28" width="34" height="3" fill="#e2724c"/>
        <rect x="27" y="36" width="4" height="4" fill="#183a5c"/>
        <rect x="34" y="36" width="10" height="10" fill="#183a5c"/>
        <rect x="27" y="46" width="10" height="6" fill="#183a5c"/>
        <rect x="42" y="46" width="4" height="4" fill="#183a5c"/>
      </svg>
      <div class="label">Attendance</div>
    </div>

    <div class="menu-card" onclick="location.hash='disciplinary'">
      <svg class="icon" viewBox="0 0 64 64">
        <rect x="10" y="50" width="22" height="6" rx="1.5" fill="#8a5a3b"/>
        <rect x="27" y="18" width="8" height="24" rx="1.5" transform="rotate(45 31 30)" fill="#8a5a3b"/>
        <rect x="17" y="16" width="22" height="10" rx="2" transform="rotate(45 28 21)" fill="#c76b4a"/>
        <rect x="20" y="12" width="22" height="4" rx="1.5" transform="rotate(45 31 14)" fill="#e2a24c"/>
        <rect x="24" y="8" width="22" height="4" rx="1.5" transform="rotate(45 35 10)" fill="#c76b4a"/>
      </svg>
      <div class="label">Disciplinary</div>
    </div>

    <div class="menu-card" onclick="location.hash='faq'">
      <svg class="icon" viewBox="0 0 64 64">
        <path d="M8 24a16 16 0 1 1 20 15.4V46l-8-6.6A16 16 0 0 1 8 24Z" fill="#7896a3"/>
        <text x="19" y="29" font-size="16" font-weight="700" fill="#fff" font-family="Arial">?</text>
        <path d="M55 40a11 11 0 1 0-16 9.8V54l6-4h1a11 11 0 0 0 9-9Z" fill="#f4c542"/>
        <path d="M35 41l3 3 6-6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="label">FAQ</div>
    </div>
  </div>

  <div class="service-desk">
    <div class="service-desk-label">Service Desk</div>
    <div class="service-desk-avatar">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#3d3d3d"/><circle cx="32" cy="26" r="10" fill="#f2c2a0"/><path d="M14 54c1-11 9-17 18-17s17 6 18 17Z" fill="#e2574c"/><path d="M14 24a18 18 0 0 1 36 0v4h-4v-4a14 14 0 0 0-28 0v4h-4Z" fill="#2c2c2c"/><rect x="10" y="26" width="5" height="8" rx="2.5" fill="#2c2c2c"/><rect x="49" y="26" width="5" height="8" rx="2.5" fill="#2c2c2c"/></svg>
    </div>
  </div>

  <div class="footer">Version 2.3.5 &copy; 2026 UniKL</div>

</div>
</body>
</html>
